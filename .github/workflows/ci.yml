name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude vocab-platform-linux --exclude vocab-platform-windows -- -D warnings
      - run: cargo test --workspace --exclude vocab-platform-linux --exclude vocab-platform-windows
      - run: cargo test -p vocab-translation-azure
      - run: cargo test -p vocab-translation-deepl
      - run: cargo test -p vocab-platform-macos
      - run: cargo build --workspace --exclude vocab-platform-linux --exclude vocab-platform-windows
      - run: swift test --package-path platform/macos/native
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude vocab-platform-macos --exclude vocab-platform-windows -- -D warnings
      - run: cargo test --workspace --exclude vocab-platform-macos --exclude vocab-platform-windows
      - run: cargo test -p vocab-translation-azure
      - run: cargo test -p vocab-translation-deepl
      - run: cargo test -p vocab-platform-linux
      - run: cargo build --workspace --exclude vocab-platform-macos --exclude vocab-platform-windows
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude vocab-platform-macos --exclude vocab-platform-linux -- -D warnings
      - run: cargo test --workspace --exclude vocab-platform-macos --exclude vocab-platform-linux
      - run: cargo test -p vocab-translation-azure
      - run: cargo test -p vocab-translation-deepl
      - run: cargo test -p vocab-platform-windows
      - run: cargo build --workspace --exclude vocab-platform-macos --exclude vocab-platform-linux
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Build per-user NSIS preview
        run: pnpm tauri build --bundles nsis
      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -Path target/release/bundle/nsis -Filter *.exe -File)
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)."
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($installer[0].Name)" } |
            Set-Content -Encoding ascii -LiteralPath "$($installer[0].FullName).sha256"
      - name: Upload commit-traceable NSIS preview
        uses: actions/upload-artifact@v4
        with:
          name: vocab-collector-windows-x64-nsis-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error
          retention-days: 14
