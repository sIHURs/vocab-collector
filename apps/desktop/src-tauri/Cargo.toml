[package]
name = "vocab-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "vocab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2"
uuid.workspace = true
vocab-application = { path = "../../../crates/application" }
vocab-capture = { path = "../../../crates/capture" }
vocab-domain = { path = "../../../crates/domain" }
vocab-platform-api = { path = "../../../crates/platform-api" }
vocab-storage = { path = "../../../crates/storage" }
vocab-sync = { path = "../../../crates/sync" }

[target.'cfg(target_os = "macos")'.dependencies]
vocab-platform-macos = { path = "../../../platform/macos/rust" }

[target.'cfg(target_os = "linux")'.dependencies]
vocab-platform-linux = { path = "../../../platform/linux" }

[target.'cfg(target_os = "windows")'.dependencies]
vocab-platform-windows = { path = "../../../platform/windows" }

[dev-dependencies]
async-trait.workspace = true
