[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/application",
  "crates/capture",
  "crates/domain",
  "crates/platform-api",
  "crates/platform-contract-tests",
  "crates/storage",
  "crates/sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
